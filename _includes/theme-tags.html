{%- comment -%} Usage: {% include theme-tags.html themes=page.themes %} {%- endcomment -%}
<ul class="theme-tags" aria-label="Themes">
  {%- for id in include.themes -%}
  {%- assign t = site.data.themes | where: "id", id | first -%}
  <li class="theme-tag theme-tag--{{ id }}">{{ t.name }}</li>
  {%- endfor -%}
</ul>
