{%- assign p = site.data.profile -%}
<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="wordmark" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>
      {%- include thread-mark.html -%}
      <span>{{ p.name }}</span>
    </a>
    <nav aria-label="Main">
      <ul class="nav">
        <li><a href="{{ '/work/' | relative_url }}"{% if page.url contains '/work/' %} aria-current="page"{% endif %}>Work</a></li>
        <li><a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a></li>
        <li><a href="{{ p.resume | relative_url }}">Resume<span class="visually-hidden"> (PDF)</span></a></li>
      </ul>
    </nav>
  </div>
</header>
